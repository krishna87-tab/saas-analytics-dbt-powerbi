
version: 2

models:
  - name: customer_health_mart
    description: >
      Customer-level analytical mart that consolidates subscription,
      revenue, product adoption, and support metrics into a single
      business-ready dataset. This model enables customer success,
      finance, and leadership teams to monitor customer health,
      identify at-risk accounts, and drive retention strategies.

    columns:

      - name: customer_id
        description: Unique identifier for the customer.
        tests:
          - unique
          - not_null

      - name: company_name
        description: Customer company name.

      - name: country
        description: Country where the customer operates.

      - name: region
        description: Geographic region of the customer.

      - name: industry
        description: Customer industry segment.

      - name: company_size
        description: Company size classification.

      - name: acquisition_channel
        description: Marketing or sales channel through which the customer was acquired.

      - name: subscription_status
        description: Current subscription status.

      - name: current_plan_name
        description: Current subscription plan.

      - name: subscription_length_days
        description: Total number of days since the subscription started.

      - name: invoice_count
        description: Total invoices generated for the customer.

      - name: total_revenue
        description: Total invoiced revenue.

      - name: total_paid
        description: Total payments successfully collected.

      - name: paid_invoice_count
        description: Number of successfully paid invoices.

      - name: late_payment_count
        description: Number of invoices paid late.

      - name: failed_payment_count
        description: Number of failed payment attempts.

      - name: avg_days_to_payment
        description: Average number of days taken to complete payment.

      - name: avg_active_users
        description: Average number of active users.

      - name: avg_user_utilization
        description: Average percentage of licensed users actively using the product.

      - name: avg_event_utilization
        description: Average utilization of allocated events.

      - name: avg_api_calls
        description: Average API calls generated by the customer.

      - name: avg_reports_created
        description: Average reports created during each usage period.

      - name: avg_active_days_rate
        description: Average percentage of active days during each month.

      - name: ticket_count
        description: Total support tickets raised.

      - name: resolved_ticket_count
        description: Number of resolved support tickets.

      - name: escalated_ticket_count
        description: Number of escalated support tickets.

      - name: high_priority_ticket_count
        description: Number of high-priority support tickets.

      - name: avg_first_response_hours
        description: Average time to first response in hours.

      - name: avg_resolution_days
        description: Average ticket resolution time in days.

      - name: sla_percentage
        description: Percentage of tickets meeting SLA targets.

      - name: payment_health
        description: >
          Payment health classification derived from failed and late payment behaviour.

      - name: usage_health
        description: >
          Product adoption classification based on user utilization.

      - name: support_health
        description: >
          Support quality classification derived from SLA performance.

      - name: health_score
        description: >
          Composite customer health score ranging from 0 to 100 based on
          subscription status, payment behaviour, product adoption,
          and support performance.

      - name: customer_health_status
        description: >
          Overall customer health classification.

        tests:
          - accepted_values:
              values:
                - Healthy
                - Stable
                - At Risk
                - Critical